name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orcamento
          POSTGRES_PASSWORD: orcamento
          POSTGRES_DB: orcamento_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orcamento" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orcamento:orcamento@localhost:5432/orcamento_test
      DATABASE_URL_UNPOOLED: postgresql://orcamento:orcamento@localhost:5432/orcamento_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          printf 'DATABASE_URL="%s"\nDATABASE_URL_UNPOOLED="%s"\n' "$DATABASE_URL" "$DATABASE_URL" > .env.test
          cp .env.test .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: test-results/
